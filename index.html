<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>早餐即時揪團 (P2P極速版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 引入免費公共 P2P 連線庫 (PeerJS) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    button, input, select { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-24 select-none">

  <!-- 頂部導航列 -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20">
          <i class="fa-solid fa-burger text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-800 leading-tight">早餐即時揪團</h1>
          <p id="cloud-status" class="text-[11px] text-amber-600 font-medium flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> 連線準備中...
          </p>
        </div>
      </div>
      <button type="button" onclick="openMenuSettingsModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full font-medium transition flex items-center gap-1 active:scale-95">
        <i class="fa-solid fa-sliders"></i>
        <span>菜單</span>
      </button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-md mx-auto px-3.5 pt-3">

    <!-- 房間與分享狀態卡 -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-3 mb-3 text-xs shadow-xs space-y-2">
      <div class="flex items-center justify-between">
        <div class="font-bold text-slate-800 flex items-center gap-1.5">
          <i class="fa-solid fa-tower-broadcast text-orange-500"></i>
          <span>身分：<span id="role-display" class="text-orange-600">正在配對...</span></span>
        </div>
        <span id="peer-count-badge" class="text-[10px] bg-slate-100 text-slate-600 font-semibold px-2 py-0.5 rounded-full">在線: 1 人</span>
      </div>
      <div class="flex items-center justify-between pt-1 border-t border-slate-100 gap-2">
        <p class="text-[11px] text-slate-400 truncate" id="room-hint">傳送連結，同事加入自動連線</p>
        <button type="button" onclick="copyShareLink()" class="px-3 py-1.5 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-semibold active:scale-95 transition text-[11px] flex items-center gap-1 shrink-0">
          <i class="fa-solid fa-share-nodes text-[10px]"></i> 分享揪團連結
        </button>
      </div>
    </div>

    <!-- 頁籤切換 -->
    <div class="flex bg-slate-200/80 p-1 rounded-2xl mb-4">
      <button type="button" id="tabBtn-order" onclick="switchTab('order')" class="flex-1 py-2 text-sm font-semibold rounded-xl transition duration-200 bg-white text-orange-600 shadow-sm flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>登記點餐</span>
      </button>
      <button type="button" id="tabBtn-list" onclick="switchTab('list')" class="flex-1 py-2 text-sm font-semibold rounded-xl transition duration-200 text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-users"></i>
        <span>誰點了什麼</span>
        <span id="badge-count" class="bg-orange-500 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
      </button>
      <button type="button" id="tabBtn-summary" onclick="switchTab('summary')" class="flex-1 py-2 text-sm font-semibold rounded-xl transition duration-200 text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-clipboard-check"></i>
        <span>結單清單</span>
      </button>
    </div>

    <!-- ================= 頁面 1: 登記點餐區 ================= -->
    <section id="view-order" class="space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">
            <i class="fa-solid fa-user text-orange-500 mr-1"></i>你的名字 / 稱呼 <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="order-userName" placeholder="例如：Leo、小美、Alex" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:bg-white transition" />
        </div>

        <div class="mb-4">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-slate-500">
              <i class="fa-solid fa-bolt text-amber-500 mr-1"></i>常用推薦 (點擊即加入)
            </span>
            <span class="text-[11px] text-slate-400">點擊加 1 份</span>
          </div>
          <div id="quick-menu-chips" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto no-scrollbar pb-1"></div>
        </div>

        <div class="border-t border-slate-100 pt-3">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-slate-700">本次選購餐點</span>
            <button type="button" onclick="addNewCustomItem()" class="text-xs text-orange-600 font-medium hover:text-orange-700 flex items-center gap-1 active:scale-95">
              <i class="fa-solid fa-plus-circle"></i> 自訂其他餐點
            </button>
          </div>

          <div id="current-items-container" class="space-y-2.5"></div>

          <div id="empty-cart-hint" class="py-6 text-center text-slate-400">
            <i class="fa-solid fa-basket-shopping text-3xl mb-2 opacity-30"></i>
            <p class="text-xs">請點上方快捷品項，或點「自訂其他餐點」！</p>
          </div>
        </div>

        <div class="mt-5 pt-3 border-t border-dashed border-slate-200 flex items-center justify-between">
          <div>
            <div class="text-[11px] text-slate-400">本次個人金額</div>
            <div class="text-lg font-bold text-orange-600">NT$ <span id="current-cart-total">0</span></div>
          </div>
          <div class="flex gap-2">
            <button type="button" id="cancel-edit-btn" onclick="cancelEditMode()" class="hidden px-3 py-2 bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold active:scale-95">
              取消修改
            </button>
            <button type="button" onclick="submitColleagueOrder()" id="submit-order-btn" class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-xl shadow-md shadow-orange-500/25 active:scale-95 transition text-sm flex items-center gap-1.5 cursor-pointer">
              <i class="fa-solid fa-cloud-arrow-up text-xs"></i>
              <span>送出登記並同步</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 頁面 2: 同事清單區 ================= -->
    <section id="view-list" class="hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">大家點的餐點 (即時同步)</h2>
        <span id="colleague-count-text" class="text-xs text-slate-500">共 0 位同事</span>
      </div>

      <div id="colleagues-order-cards" class="space-y-3"></div>

      <div id="empty-list-hint" class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-100">
        <i class="fa-solid fa-user-clock text-4xl mb-3 text-slate-300"></i>
        <p class="text-sm font-medium text-slate-600">目前房間內還沒有訂單</p>
        <p class="text-xs text-slate-400 mt-1">其他人送出後，畫面會即時自動出現！</p>
      </div>
    </section>

    <!-- ================= 頁面 3: 結單彙整區 ================= -->
    <section id="view-summary" class="hidden space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="text-xs text-slate-400 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-utensils text-orange-500"></i> 餐點總份數
          </div>
          <div class="text-2xl font-bold text-slate-800"><span id="sum-total-qty">0</span> <span class="text-xs font-normal text-slate-400">份</span></div>
        </div>
        <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="text-xs text-slate-400 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-sack-dollar text-emerald-500"></i> 應付總金額
          </div>
          <div class="text-2xl font-bold text-orange-600">NT$ <span id="sum-total-price">0</span></div>
        </div>
      </div>

      <!-- 給店家的彙整表 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-4 bg-orange-500 rounded-full"></span>
            <h3 class="text-sm font-bold text-slate-800">向店家點餐彙整表</h3>
          </div>
          <span class="text-[11px] text-slate-400 font-medium">同名同備註已自動加總</span>
        </div>
        
        <div class="overflow-hidden rounded-xl border border-slate-100">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-100">
              <tr>
                <th class="py-2.5 px-3">餐點名稱 (備註)</th>
                <th class="py-2.5 px-2 text-center w-14">數量</th>
                <th class="py-2.5 px-3 text-right w-16">小計</th>
              </tr>
            </thead>
            <tbody id="summary-items-tbody" class="divide-y divide-slate-100 text-slate-700"></tbody>
          </table>
        </div>
      </div>

      <!-- 同事收錢分攤明細 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-4 bg-amber-500 rounded-full"></span>
            <h3 class="text-sm font-bold text-slate-800">各同事應付分攤金額</h3>
          </div>
        </div>
        <div id="summary-colleagues-list" class="space-y-2 text-xs"></div>
      </div>

      <!-- 快捷操作 -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button type="button" onclick="copyLineSummary()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition">
          <i class="fa-solid fa-copy"></i>
          <span>複製 LINE 格式清單</span>
        </button>

        <button type="button" onclick="confirmClearAll()" class="w-full py-3 bg-slate-200 hover:bg-rose-100 text-slate-700 hover:text-rose-600 font-medium rounded-xl text-xs flex items-center justify-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-trash-can"></i>
          <span>清空今日全部訂單</span>
        </button>
      </div>
    </section>
  </main>

  <!-- 常用菜單設定彈窗 -->
  <div id="menu-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-gear text-orange-500"></i> 管理常用推薦菜單
        </h3>
        <button type="button" onclick="closeMenuSettingsModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs active:scale-90">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-3.5 border-b border-slate-100 bg-white">
        <div class="text-xs font-semibold text-slate-600 mb-2">新增推薦菜色：</div>
        <div class="flex gap-2 mb-2">
          <input type="text" id="new-preset-name" placeholder="餐點名稱 (例: 原味蛋餅)" class="flex-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-400">
          <input type="number" id="new-preset-price" placeholder="價格" class="w-20 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-400">
        </div>
        <button type="button" onclick="addPresetItem()" class="w-full py-2 bg-orange-500 text-white rounded-lg text-xs font-semibold shadow-sm hover:bg-orange-600 active:scale-95 transition">
          + 加入推薦列表
        </button>
      </div>

      <div class="p-3.5 overflow-y-auto space-y-2 flex-1" id="preset-items-list"></div>

      <div class="p-3 bg-slate-50 border-t border-slate-100 flex justify-between">
        <button type="button" onclick="resetDefaultPresets()" class="text-xs text-slate-500 hover:text-orange-600">重設為系統預設</button>
        <button type="button" onclick="closeMenuSettingsModal()" class="px-4 py-1.5 bg-slate-800 text-white text-xs font-medium rounded-lg">完成</button>
      </div>
    </div>
  </div>

  <script>
    var DEFAULT_PRESETS = [
      { id: '1', name: '原味蛋餅', price: 30 },
      { id: '2', name: '培根蛋吐司', price: 45 },
      { id: '3', name: '蘿蔔糕加蛋', price: 45 },
      { id: '4', name: '鮪魚蛋餅', price: 40 },
      { id: '5', name: '中杯冰奶茶', price: 25 },
      { id: '6', name: '大杯冰奶茶', price: 30 },
      { id: '7', name: '大杯熱紅茶', price: 20 },
      { id: '8', name: '無糖豆漿', price: 20 },
      { id: '9', name: '卡啦雞腿堡', price: 65 }
    ];

    var orders = [];
    var presets = [];
    var currentCart = [];
    var editingOrderId = null;

    // P2P 通訊狀態變數
    var peer = null;
    var isHost = false;
    var hostConn = null;
    var guestConns = [];
    var myRoomId = '';

    window.addEventListener('DOMContentLoaded', function() {
      var savedName = localStorage.getItem('bf_my_name');
      if (savedName) document.getElementById('order-userName').value = savedName;

      var savedPresets = localStorage.getItem('bf_presets_p2p');
      presets = savedPresets ? JSON.parse(savedPresets) : DEFAULT_PRESETS.slice();

      renderQuickMenuChips();
      renderCurrentCart();
      initP2P();
    });

    // ==========================================
    // 零設定 WebRTC P2P 連線引擎
    // ==========================================
    function initP2P() {
      var params = new URLSearchParams(window.location.search);
      var roomParam = params.get('room');
      var statusElem = document.getElementById('cloud-status');
      var roleElem = document.getElementById('role-display');

      if (!roomParam) {
        // 沒有 room 參數 ➔ 本機作為主揪 (Host)
        isHost = true;
        // 隨機生成 6 碼短房號
        myRoomId = 'bf_' + Math.random().toString(36).substring(2, 8);
        peer = new Peer(myRoomId);

        peer.on('open', function(id) {
          roleElem.innerText = '團購主揪 (房號: ' + id.replace('bf_', '') + ')';
          statusElem.className = 'text-[11px] text-emerald-600 font-medium flex items-center gap-1';
          statusElem.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 揪團中 (即時同步)';
          
          // 自動將網址帶上房號，方便直接複製當前網址
          var newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + id;
          window.history.replaceState({ path: newUrl }, '', newUrl);

          // 載入本地快取
          try {
            var localOrders = localStorage.getItem('bf_orders_host');
            if (localOrders) orders = JSON.parse(localOrders);
            renderColleagueList();
            renderSummaryView();
            updateBadge();
          } catch(e) {}
        });

        // 當同事連進來時
        peer.on('connection', function(conn) {
          guestConns.push(conn);
          updateOnlineCount();

          // 剛連上線，主揪將現有訂單即時倒給新進同事
          conn.on('open', function() {
            conn.send({ type: 'SYNC_ALL', orders: orders });
          });

          // 收到同事送出的餐點
          conn.on('data', function(data) {
            handleHostIncomingData(data);
          });

          conn.on('close', function() {
            guestConns = guestConns.filter(function(c) { return c !== conn; });
            updateOnlineCount();
          });
        });

      } else {
        // 網址有帶 room 參數 ➔ 作為跟團同事 (Guest)
        isHost = false;
        myRoomId = roomParam;
        peer = new Peer(); // 隨機分配 ID 連線

        peer.on('open', function() {
          roleElem.innerText = '跟團同事';
          connectToHost(myRoomId);
        });
      }

      peer.on('error', function(err) {
        console.warn('P2P 提示：', err);
        statusElem.className = 'text-[11px] text-rose-500 font-medium flex items-center gap-1';
        statusElem.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> 連線稍有延遲，點餐仍可送出';
      });
    }

    function connectToHost(targetRoomId) {
      var statusElem = document.getElementById('cloud-status');
      hostConn = peer.connect(targetRoomId, { reliable: true });

      hostConn.on('open', function() {
        statusElem.className = 'text-[11px] text-emerald-600 font-medium flex items-center gap-1';
        statusElem.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 已連線至主揪 (即時同步)';
      });

      hostConn.on('data', function(data) {
        if (data.type === 'SYNC_ALL') {
          orders = data.orders || [];
          renderColleagueList();
          renderSummaryView();
          updateBadge();
        }
      });

      hostConn.on('close', function() {
        statusElem.className = 'text-[11px] text-amber-500 font-medium flex items-center gap-1';
        statusElem.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500"></span> 與主揪中斷連線';
      });
    }

    function handleHostIncomingData(data) {
      if (data.type === 'NEW_ORDER') {
        orders.unshift(data.order);
      } else if (data.type === 'UPDATE_ORDER') {
        var idx = orders.findIndex(function(o) { return o.id === data.order.id; });
        if (idx !== -1) orders[idx] = data.order;
      } else if (data.type === 'DELETE_ORDER') {
        orders = orders.filter(function(o) { return o.id !== data.orderId; });
      }

      // 主揪本地備份
      try { localStorage.setItem('bf_orders_host', JSON.stringify(orders)); } catch(e) {}
      renderColleagueList();
      renderSummaryView();
      updateBadge();

      // 主揪廣播給所有線上的其他同事
      broadcastToGuests({ type: 'SYNC_ALL', orders: orders });
    }

    function broadcastToGuests(msg) {
      guestConns.forEach(function(c) {
        if (c.open) c.send(msg);
      });
    }

    function updateOnlineCount() {
      var badge = document.getElementById('peer-count-badge');
      badge.innerText = '在線: ' + (guestConns.length + 1) + ' 人';
    }

    function copyShareLink() {
      var link = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function() {
          alert('已複製揪團連結！傳到 LINE 群組，大家點開就自動連線進來了！');
        }).catch(function() {
          prompt('請複製此連結傳給同事：', link);
        });
      } else {
        prompt('請複製此連結傳給同事：', link);
      }
    }

    // ==========================================
    // 點餐與登記互動
    // ==========================================
    function switchTab(tabId) {
      var views = ['order', 'list', 'summary'];
      for (var i = 0; i < views.length; i++) {
        var v = views[i];
        var section = document.getElementById('view-' + v);
        var btn = document.getElementById('tabBtn-' + v);
        if (v === tabId) {
          section.classList.remove('hidden');
          btn.classList.add('bg-white', 'text-orange-600', 'shadow-sm');
          btn.classList.remove('text-slate-600');
        } else {
          section.classList.add('hidden');
          btn.classList.remove('bg-white', 'text-orange-600', 'shadow-sm');
          btn.classList.add('text-slate-600');
        }
      }

      if (tabId === 'list') renderColleagueList();
      if (tabId === 'summary') renderSummaryView();
    }

    function renderQuickMenuChips() {
      var container = document.getElementById('quick-menu-chips');
      container.innerHTML = '';
      presets.forEach(function(p) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'px-2.5 py-1.5 bg-orange-50 hover:bg-orange-100 text-orange-950 rounded-xl text-xs font-medium border border-orange-200/60 flex items-center gap-1 active:scale-95 transition';
        chip.innerHTML = '<span>' + escapeHtml(p.name) + '</span><span class="text-orange-600 font-bold">$' + p.price + '</span>';
        chip.onclick = function() { addFromPreset(p); };
        container.appendChild(chip);
      });
    }

    function addFromPreset(preset) {
      var existing = currentCart.find(function(i) {
        return i.name === preset.name && (!i.note || i.note.trim() === '');
      });
      if (existing) {
        existing.quantity += 1;
      } else {
        currentCart.push({
          id: Date.now() + Math.random().toString(36).substr(2, 4),
          name: preset.name,
          price: Number(preset.price) || 0,
          quantity: 1,
          note: ''
        });
      }
      renderCurrentCart();
    }

    function addNewCustomItem() {
      currentCart.push({
        id: Date.now() + Math.random().toString(36).substr(2, 4),
        name: '',
        price: 0,
        quantity: 1,
        note: ''
      });
      renderCurrentCart();
    }

    function renderCurrentCart() {
      var container = document.getElementById('current-items-container');
      var emptyHint = document.getElementById('empty-cart-hint');
      var totalDisplay = document.getElementById('current-cart-total');

      container.innerHTML = '';
      if (currentCart.length === 0) {
        emptyHint.classList.remove('hidden');
        totalDisplay.innerText = '0';
        return;
      }
      emptyHint.classList.add('hidden');

      var currentTotal = 0;
      currentCart.forEach(function(item, index) {
        var itemTotal = (item.price || 0) * (item.quantity || 1);
        currentTotal += itemTotal;

        var row = document.createElement('div');
        row.className = 'p-3 bg-slate-50 border border-slate-200/70 rounded-xl text-xs space-y-2';
        row.innerHTML = 
          '<div class="flex items-center gap-2">' +
            '<input type="text" placeholder="品項名稱" value="' + escapeHtml(item.name) + '" ' +
              'oninput="updateCartItemField(' + index + ', \'name\', this.value)" ' +
              'class="flex-1 px-2.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-orange-400">' +
            '<div class="flex items-center gap-1">' +
              '<span class="text-slate-400 text-[11px]">$</span>' +
              '<input type="number" placeholder="單價" value="' + (item.price === 0 ? '' : item.price) + '" ' +
                'oninput="updateCartItemField(' + index + ', \'price\', Number(this.value))" ' +
                'class="w-16 px-2 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-right focus:outline-none focus:ring-1 focus:ring-orange-400">' +
            '</div>' +
            '<button type="button" onclick="removeCartItem(' + index + ')" class="text-slate-400 hover:text-rose-500 p-1.5">' +
              '<i class="fa-solid fa-trash"></i>' +
            '</button>' +
          '</div>' +
          '<div class="flex items-center justify-between gap-2 pt-1">' +
            '<input type="text" placeholder="備註 (如: 冰/溫、去冰、加辣、去小黃瓜)" value="' + escapeHtml(item.note || '') + '" ' +
              'oninput="updateCartItemField(' + index + ', \'note\', this.value)" ' +
              'class="flex-1 px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-[11px] text-slate-600 focus:outline-none focus:ring-1 focus:ring-orange-400">' +
            '<div class="flex items-center border border-slate-200 rounded-lg bg-white overflow-hidden shadow-xs">' +
              '<button type="button" onclick="changeCartQty(' + index + ', -1)" class="w-7 h-7 flex items-center justify-center text-slate-500 hover:bg-slate-100">' +
                '<i class="fa-solid fa-minus text-[10px]"></i>' +
              '</button>' +
              '<span class="w-7 text-center font-bold text-slate-700">' + item.quantity + '</span>' +
              '<button type="button" onclick="changeCartQty(' + index + ', 1)" class="w-7 h-7 flex items-center justify-center text-slate-500 hover:bg-slate-100">' +
                '<i class="fa-solid fa-plus text-[10px]"></i>' +
              '</button>' +
            '</div>' +
          '</div>';
        container.appendChild(row);
      });
      totalDisplay.innerText = currentTotal;
    }

    function updateCartItemField(index, field, value) {
      if (currentCart[index]) {
        currentCart[index][field] = value;
        if (field === 'price') {
          var currentTotal = currentCart.reduce(function(sum, it) {
            return sum + (Number(it.price) || 0) * (it.quantity || 1);
          }, 0);
          document.getElementById('current-cart-total').innerText = currentTotal;
        }
      }
    }

    function changeCartQty(index, delta) {
      if (!currentCart[index]) return;
      var newQty = currentCart[index].quantity + delta;
      if (newQty <= 0) removeCartItem(index);
      else {
        currentCart[index].quantity = newQty;
        renderCurrentCart();
      }
    }

    function removeCartItem(index) {
      currentCart.splice(index, 1);
      renderCurrentCart();
    }

    function submitColleagueOrder() {
      var nameInput = document.getElementById('order-userName');
      var colleagueName = (nameInput.value || '').trim();

      if (!colleagueName) {
        alert('請先輸入你的名字或稱呼喔！');
        nameInput.focus();
        return;
      }
      if (currentCart.length === 0) {
        alert('你尚未選擇任何餐點，請點擊上方推薦品項加入！');
        return;
      }
      var hasEmptyName = currentCart.some(function(i) {
        return !i.name || i.name.trim() === '';
      });
      if (hasEmptyName) {
        alert('有餐點名稱是空白的，請填寫或刪除該項目！');
        return;
      }

      try { localStorage.setItem('bf_my_name', colleagueName); } catch(e) {}

      var userTotal = currentCart.reduce(function(acc, it) {
        return acc + (Number(it.price) || 0) * (it.quantity || 1);
      }, 0);

      var now = new Date();
      var dateStr = (now.getMonth() + 1) + '/' + now.getDate();
      var timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

      var newRecord = {
        id: editingOrderId || ('ord_' + Date.now()),
        userName: colleagueName,
        items: JSON.parse(JSON.stringify(currentCart)),
        totalPrice: userTotal,
        time: dateStr + ' ' + timeStr
      };

      if (isHost) {
        if (editingOrderId) {
          var idx = orders.findIndex(function(o) { return o.id === editingOrderId; });
          if (idx !== -1) orders[idx] = newRecord;
          cancelEditMode();
        } else {
          orders.unshift(newRecord);
          currentCart = [];
          renderCurrentCart();
        }
        try { localStorage.setItem('bf_orders_host', JSON.stringify(orders)); } catch(e) {}
        renderColleagueList();
        renderSummaryView();
        updateBadge();
        broadcastToGuests({ type: 'SYNC_ALL', orders: orders });
      } else {
        // 同事傳給主揪
        if (hostConn && hostConn.open) {
          hostConn.send({
            type: editingOrderId ? 'UPDATE_ORDER' : 'NEW_ORDER',
            order: newRecord
          });
          if (editingOrderId) cancelEditMode();
          else {
            currentCart = [];
            renderCurrentCart();
          }
        } else {
          alert('尚未連上主揪，請確保主揪的網頁保持開啟！');
          return;
        }
      }

      alert('登記成功！已同步至所有人的名單');
      switchTab('list');
    }

    function editOrder(orderId) {
      var order = orders.find(function(o) { return o.id === orderId; });
      if (!order) return;

      editingOrderId = order.id;
      document.getElementById('order-userName').value = order.userName;
      currentCart = JSON.parse(JSON.stringify(order.items));

      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      document.getElementById('submit-order-btn').innerHTML = '<i class="fa-solid fa-check text-xs"></i><span>確認修改並同步</span>';

      switchTab('order');
      renderCurrentCart();
    }

    function cancelEditMode() {
      editingOrderId = null;
      currentCart = [];
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      document.getElementById('submit-order-btn').innerHTML = '<i class="fa-solid fa-cloud-arrow-up text-xs"></i><span>送出登記並同步</span>';
      renderCurrentCart();
    }

    function deleteOrder(orderId) {
      var target = orders.find(function(o) { return o.id === orderId; });
      if (!confirm('確定要刪除「' + (target ? target.userName : '此同事') + '」的餐點嗎？此動作將同步到所有人的手機。')) return;

      if (isHost) {
        orders = orders.filter(function(o) { return o.id !== orderId; });
        try { localStorage.setItem('bf_orders_host', JSON.stringify(orders)); } catch(e) {}
        renderColleagueList();
        renderSummaryView();
        updateBadge();
        broadcastToGuests({ type: 'SYNC_ALL', orders: orders });
      } else {
        if (hostConn && hostConn.open) {
          hostConn.send({ type: 'DELETE_ORDER', orderId: orderId });
        }
      }
    }

    function renderColleagueList() {
      var container = document.getElementById('colleagues-order-cards');
      var emptyHint = document.getElementById('empty-list-hint');
      var countText = document.getElementById('colleague-count-text');

      container.innerHTML = '';
      countText.innerText = '共 ' + orders.length + ' 位同事';

      if (orders.length === 0) {
        emptyHint.classList.remove('hidden');
        return;
      }
      emptyHint.classList.add('hidden');

      orders.forEach(function(ord) {
        var card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2.5';

        var itemsHtml = (ord.items || []).map(function(it) {
          return '<div class="flex justify-between items-center text-xs py-1 border-b border-slate-50 last:border-0">' +
            '<div>' +
              '<span class="font-medium text-slate-800">' + escapeHtml(it.name) + '</span>' +
              (it.note ? '<span class="text-[10px] bg-slate-100 text-orange-600 px-1.5 py-0.5 rounded ml-1">' + escapeHtml(it.note) + '</span>' : '') +
              '<span class="text-slate-400 text-[11px] ml-1">x' + it.quantity + '</span>' +
            '</div>' +
            '<div class="font-semibold text-slate-700">NT$ ' + (it.price * it.quantity) + '</div>' +
          '</div>';
        }).join('');

        card.innerHTML = 
          '<div class="flex justify-between items-start">' +
            '<div class="flex items-center gap-2">' +
              '<div class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-xs">' +
                escapeHtml((ord.userName || '友').charAt(0)) +
              '</div>' +
              '<div>' +
                '<h4 class="text-sm font-bold text-slate-800">' + escapeHtml(ord.userName) + '</h4>' +
                '<p class="text-[10px] text-slate-400">登記時間: ' + (ord.time || '') + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-1.5">' +
              '<button type="button" onclick="editOrder(\'' + ord.id + '\')" class="p-1.5 text-slate-400 hover:text-orange-600 rounded-lg hover:bg-orange-50 transition" title="修改">' +
                '<i class="fa-solid fa-pen-to-square"></i>' +
              '</button>' +
              '<button type="button" onclick="deleteOrder(\'' + ord.id + '\')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition" title="刪除">' +
                '<i class="fa-solid fa-trash"></i>' +
              '</button>' +
            '</div>' +
          '</div>' +
          '<div class="bg-slate-50 rounded-xl p-2.5 space-y-1">' + itemsHtml + '</div>' +
          '<div class="flex justify-between items-center pt-1 text-xs">' +
            '<span class="text-slate-400">個人應付</span>' +
            '<span class="text-sm font-bold text-orange-600">NT$ ' + ord.totalPrice + '</span>' +
          '</div>';
        container.appendChild(card);
      });
    }

    function renderSummaryView() {
      var summaryTbody = document.getElementById('summary-items-tbody');
      var colleagueSumContainer = document.getElementById('summary-colleagues-list');
      
      summaryTbody.innerHTML = '';
      colleagueSumContainer.innerHTML = '';

      var grandTotalQty = 0;
      var grandTotalPrice = 0;
      var aggregatedMap = {};

      orders.forEach(function(o) {
        (o.items || []).forEach(function(it) {
          var key = (it.name || '').trim() + '__' + (it.note || '').trim();
          if (!aggregatedMap[key]) {
            aggregatedMap[key] = {
              name: (it.name || '').trim(),
              note: (it.note || '').trim(),
              price: Number(it.price) || 0,
              quantity: 0
            };
          }
          aggregatedMap[key].quantity += (Number(it.quantity) || 1);
          grandTotalQty += (Number(it.quantity) || 1);
        });
      });

      var keys = Object.keys(aggregatedMap);
      if (keys.length === 0) {
        summaryTbody.innerHTML = '<tr><td colspan="3" class="py-6 text-center text-slate-400 text-xs">尚無任何餐點記錄</td></tr>';
      } else {
        keys.forEach(function(k) {
          var item = aggregatedMap[k];
          var rowSubtotal = item.price * item.quantity;
          grandTotalPrice += rowSubtotal;

          var tr = document.createElement('tr');
          tr.className = 'hover:bg-slate-50/70';
          tr.innerHTML = 
            '<td class="py-2.5 px-3">' +
              '<div class="font-medium text-slate-800">' + escapeHtml(item.name) + '</div>' +
              (item.note ? '<div class="text-[10px] text-orange-600 font-normal">↳ ' + escapeHtml(item.note) + '</div>' : '') +
            '</td>' +
            '<td class="py-2.5 px-2 text-center font-bold text-slate-700 bg-slate-50/50">' + item.quantity + '</td>' +
            '<td class="py-2.5 px-3 text-right font-semibold text-slate-600">$' + rowSubtotal + '</td>';
          summaryTbody.appendChild(tr);
        });
      }

      if (orders.length === 0) {
        colleagueSumContainer.innerHTML = '<div class="text-center text-slate-400 py-4">無資料</div>';
      } else {
        orders.forEach(function(o) {
          var row = document.createElement('div');
          row.className = 'flex justify-between items-center py-2 px-2.5 bg-slate-50 rounded-xl';
          row.innerHTML = 
            '<div class="flex items-center gap-2">' +
              '<span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 font-bold flex items-center justify-center text-[10px]">' +
                escapeHtml((o.userName || '友').charAt(0)) +
              '</span>' +
              '<span class="font-medium text-slate-700">' + escapeHtml(o.userName) + '</span>' +
            '</div>' +
            '<div class="font-bold text-orange-600">NT$ ' + o.totalPrice + '</div>';
          colleagueSumContainer.appendChild(row);
        });
      }

      document.getElementById('sum-total-qty').innerText = grandTotalQty;
      document.getElementById('sum-total-price').innerText = grandTotalPrice;
    }

    function updateBadge() {
      var badge = document.getElementById('badge-count');
      if (orders && orders.length > 0) {
        badge.innerText = orders.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function copyLineSummary() {
      if (orders.length === 0) {
        alert('目前沒有訂單可複製喔！');
        return;
      }

      var aggregatedMap = {};
      var totalQty = 0;
      var totalPrice = 0;

      orders.forEach(function(o) {
        totalPrice += o.totalPrice;
        (o.items || []).forEach(function(it) {
          totalQty += it.quantity;
          var key = it.name.trim() + '__' + (it.note || '').trim();
          if (!aggregatedMap[key]) {
            aggregatedMap[key] = { name: it.name.trim(), note: (it.note || '').trim(), qty: 0 };
          }
          aggregatedMap[key].qty += it.quantity;
        });
      });

      var today = new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' });
      var text = '🥪【' + today + ' 早餐團購結單表】🥪\n' +
                 '--------------------------\n' +
                 '📞【向店家點餐彙整】\n';

      Object.keys(aggregatedMap).forEach(function(k) {
        var item = aggregatedMap[k];
        text += '• ' + item.name + (item.note ? ' (' + item.note + ')' : '') + ' x ' + item.qty + '\n';
      });

      text += '--------------------------\n' +
              '💰【各人分攤應付】\n';
      orders.forEach(function(o) {
        text += '• ' + o.userName + '：$' + o.totalPrice + ' 元\n';
      });

      text += '--------------------------\n' +
              '總份數：' + totalQty + ' 份\n' +
              '總金額：NT$ ' + totalPrice + ' 元\n' +
              '請大家備好零錢或轉帳給主揪囉！感謝大家～';

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          alert('已複製結單清單！直接貼到 LINE 群即可');
        }).catch(function() {
          prompt('請複製以下結單清單：', text);
        });
      } else {
        prompt('請複製以下結單清單：', text);
      }
    }

    function confirmClearAll() {
      if (orders.length === 0) {
        alert('目前房間本來就沒有任何訂單！');
        return;
      }
      if (!isHost) {
        alert('只有主揪可以清空全部訂單喔！');
        return;
      }
      if (confirm('確定要清空今天的所有訂單嗎？所有同事手機上的畫面都會同步清空！')) {
        orders = [];
        try { localStorage.removeItem('bf_orders_host'); } catch(e) {}
        renderColleagueList();
        renderSummaryView();
        updateBadge();
        broadcastToGuests({ type: 'SYNC_ALL', orders: orders });
        alert('已清空所有訂單！');
      }
    }

    // 常用推薦菜單設定
    function openMenuSettingsModal() {
      renderPresetSettingsList();
      document.getElementById('menu-modal').classList.remove('hidden');
    }
    function closeMenuSettingsModal() {
      document.getElementById('menu-modal').classList.add('hidden');
      renderQuickMenuChips();
    }
    function renderPresetSettingsList() {
      var list = document.getElementById('preset-items-list');
      list.innerHTML = '';
      presets.forEach(function(p, idx) {
        var div = document.createElement('div');
        div.className = 'flex items-center justify-between p-2 bg-slate-50 border border-slate-100 rounded-lg text-xs';
        div.innerHTML = 
          '<div>' +
            '<span class="font-medium text-slate-800">' + escapeHtml(p.name) + '</span>' +
            '<span class="text-orange-600 font-bold ml-1">$' + p.price + '</span>' +
          '</div>' +
          '<button type="button" onclick="deletePresetItem(' + idx + ')" class="text-slate-400 hover:text-rose-500 p-1">' +
            '<i class="fa-solid fa-trash-can"></i>' +
          '</button>';
        list.appendChild(div);
      });
    }
    function addPresetItem() {
      var nameInput = document.getElementById('new-preset-name');
      var priceInput = document.getElementById('new-preset-price');
      var name = (nameInput.value || '').trim();
      var price = Number(priceInput.value);
      if (!name) return alert('請輸入品項名稱');
      presets.push({ id: Date.now().toString(), name: name, price: isNaN(price) ? 0 : price });
      nameInput.value = '';
      priceInput.value = '';
      try { localStorage.setItem('bf_presets_p2p', JSON.stringify(presets)); } catch(e) {}
      renderPresetSettingsList();
    }
    function deletePresetItem(index) {
      presets.splice(index, 1);
      try { localStorage.setItem('bf_presets_p2p', JSON.stringify(presets)); } catch(e) {}
      renderPresetSettingsList();
    }
    function resetDefaultPresets() {
      if (confirm('確定重置推薦菜單為預設狀態嗎？')) {
        presets = DEFAULT_PRESETS.slice();
        try { localStorage.setItem('bf_presets_p2p', JSON.stringify(presets)); } catch(e) {}
        renderPresetSettingsList();
        alert('已重設為預設菜單');
      }
    }

    function escapeHtml(string) {
      if (!string) return '';
      return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
