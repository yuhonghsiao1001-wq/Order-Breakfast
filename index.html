<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>早餐揪團結單小幫手</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    button, input, select { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-24 select-none">

  <!-- 頂部導航列 -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-white shadow-md shadow-orange-500/20">
          <i class="fa-solid fa-burger text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-800 leading-tight">早餐揪團訂單</h1>
          <p class="text-xs text-slate-400">手機點餐・多人彙總</p>
        </div>
      </div>
      <button type="button" onclick="openMenuSettingsModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full font-medium transition flex items-center gap-1 active:scale-95">
        <i class="fa-solid fa-sliders"></i>
        <span>常用菜單</span>
      </button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-md mx-auto px-3.5 pt-3">

    <!-- 頁籤切換 -->
    <div class="flex bg-slate-200/80 p-1 rounded-2xl mb-4">
      <button type="button" id="tabBtn-order" onclick="switchTab('order')" class="flex-1 py-2 text-sm font-semibold rounded-xl transition duration-200 bg-white text-orange-600 shadow-sm flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>登記點餐</span>
      </button>
      <button type="button" id="tabBtn-list" onclick="switchTab('list')" class="flex-1 py-2 text-sm font-semibold rounded-xl transition duration-200 text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-users"></i>
        <span>誰點了什麼</span>
        <span id="badge-count" class="bg-orange-500 text-white text-[10px] px-1.5 py-0.2 rounded-full hidden">0</span>
      </button>
      <button type="button" id="tabBtn-summary" onclick="switchTab('summary')" class="flex-1 py-2 text-sm font-semibold rounded-xl transition duration-200 text-slate-600 hover:text-slate-800 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-clipboard-check"></i>
        <span>結單清單</span>
      </button>
    </div>

    <!-- ================= 頁面 1: 登記點餐區 ================= -->
    <section id="view-order" class="space-y-4">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <!-- 點餐人 -->
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">
            <i class="fa-solid fa-user text-orange-500 mr-1"></i>你的名字 / 稱呼 <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="order-userName" placeholder="例如：Leo、Alex、小美" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:bg-white transition" />
        </div>

        <!-- 常用推薦 -->
        <div class="mb-4">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-slate-500">
              <i class="fa-solid fa-bolt text-amber-500 mr-1"></i>常用推薦 (點擊即加入)
            </span>
            <span class="text-[11px] text-slate-400">點擊加 1 份</span>
          </div>
          <div id="quick-menu-chips" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto no-scrollbar pb-1"></div>
        </div>

        <!-- 當前已選項目列表 -->
        <div class="border-t border-slate-100 pt-3">
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-slate-700">本次選購餐點</span>
            <button type="button" onclick="addNewCustomItem()" class="text-xs text-orange-600 font-medium hover:text-orange-700 flex items-center gap-1 active:scale-95">
              <i class="fa-solid fa-plus-circle"></i> 自訂其他餐點
            </button>
          </div>

          <div id="current-items-container" class="space-y-2.5"></div>

          <div id="empty-cart-hint" class="py-6 text-center text-slate-400">
            <i class="fa-solid fa-basket-shopping text-3xl mb-2 opacity-30"></i>
            <p class="text-xs">請點上方快捷品項，或點「自訂其他餐點」！</p>
          </div>
        </div>

        <!-- 本次小計與送出 -->
        <div class="mt-5 pt-3 border-t border-dashed border-slate-200 flex items-center justify-between">
          <div>
            <div class="text-[11px] text-slate-400">本次個人金額</div>
            <div class="text-lg font-bold text-orange-600">NT$ <span id="current-cart-total">0</span></div>
          </div>
          <div class="flex gap-2">
            <button type="button" id="cancel-edit-btn" onclick="cancelEditMode()" class="hidden px-3 py-2 bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold active:scale-95">
              取消修改
            </button>
            <button type="button" onclick="submitColleagueOrder()" id="submit-order-btn" class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-xl shadow-md shadow-orange-500/25 active:scale-95 transition text-sm flex items-center gap-1.5 cursor-pointer">
              <i class="fa-solid fa-paper-plane text-xs"></i>
              <span>送出登記</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 頁面 2: 同事清單區 ================= -->
    <section id="view-list" class="hidden space-y-3">
      <!-- 快捷代碼同步工具區 -->
      <div class="bg-amber-50 border border-amber-200/70 rounded-2xl p-3 text-xs space-y-2">
        <div class="font-bold text-amber-900 flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <i class="fa-solid fa-arrows-rotate text-amber-600"></i> 多人跨手機同步小工具
          </span>
          <button type="button" onclick="toggleSyncBox()" class="text-amber-700 underline text-[11px]">展開/收合</button>
        </div>
        <div id="sync-tools-box" class="space-y-2 pt-1 hidden">
          <p class="text-amber-800 text-[11px] leading-relaxed">
            同事在各自手機點好後，可點「分享我的餐點字串」貼到 LINE 群；主揪點「貼上並匯入」即可瞬間將所有人合併在一起！
          </p>
          <div class="flex gap-2">
            <button type="button" onclick="exportLatestOrder()" class="flex-1 py-1.5 bg-white border border-amber-300 rounded-lg text-amber-800 font-semibold hover:bg-amber-100 transition active:scale-95">
              複製我的單一餐點字串
            </button>
            <button type="button" onclick="importFromPrompt()" class="flex-1 py-1.5 bg-amber-600 text-white rounded-lg font-semibold hover:bg-amber-700 transition active:scale-95">
              主揪貼上匯入
            </button>
          </div>
        </div>
      </div>

      <div class="flex justify-between items-center px-1">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">已登記點餐名單</h2>
        <span id="colleague-count-text" class="text-xs text-slate-500">共 0 位同事</span>
      </div>

      <div id="colleagues-order-cards" class="space-y-3"></div>

      <div id="empty-list-hint" class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-100">
        <i class="fa-solid fa-user-clock text-4xl mb-3 text-slate-300"></i>
        <p class="text-sm font-medium text-slate-600">目前還沒有人填寫</p>
        <p class="text-xs text-slate-400 mt-1">請切換到「登記點餐」送出您的餐點！</p>
      </div>
    </section>

    <!-- ================= 頁面 3: 結單彙整區 ================= -->
    <section id="view-summary" class="hidden space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="text-xs text-slate-400 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-utensils text-orange-500"></i> 餐點總份數
          </div>
          <div class="text-2xl font-bold text-slate-800"><span id="sum-total-qty">0</span> <span class="text-xs font-normal text-slate-400">份</span></div>
        </div>
        <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
          <div class="text-xs text-slate-400 mb-1 flex items-center gap-1">
            <i class="fa-solid fa-sack-dollar text-emerald-500"></i> 應付總金額
          </div>
          <div class="text-2xl font-bold text-orange-600">NT$ <span id="sum-total-price">0</span></div>
        </div>
      </div>

      <!-- 給店家的彙整表 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-4 bg-orange-500 rounded-full"></span>
            <h3 class="text-sm font-bold text-slate-800">向店家點餐彙整表</h3>
          </div>
          <span class="text-[11px] text-slate-400 font-medium">同名同備註已合併</span>
        </div>
        
        <div class="overflow-hidden rounded-xl border border-slate-100">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-100">
              <tr>
                <th class="py-2.5 px-3">餐點名稱 (備註)</th>
                <th class="py-2.5 px-2 text-center w-14">數量</th>
                <th class="py-2.5 px-3 text-right w-16">小計</th>
              </tr>
            </thead>
            <tbody id="summary-items-tbody" class="divide-y divide-slate-100 text-slate-700"></tbody>
          </table>
        </div>
      </div>

      <!-- 同事收錢分攤明細 -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-4 bg-amber-500 rounded-full"></span>
            <h3 class="text-sm font-bold text-slate-800">各同事應付分攤表</h3>
          </div>
        </div>
        <div id="summary-colleagues-list" class="space-y-2 text-xs"></div>
      </div>

      <!-- 快捷操作 -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button type="button" onclick="copyLineSummary()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition">
          <i class="fa-solid fa-copy"></i>
          <span>複製 LINE 格式清單</span>
        </button>

        <button type="button" onclick="confirmClearAll()" class="w-full py-3 bg-slate-200 hover:bg-rose-100 text-slate-700 hover:text-rose-600 font-medium rounded-xl text-xs flex items-center justify-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-trash-can"></i>
          <span>清空今日全部訂單</span>
        </button>
      </div>
    </section>
  </main>

  <!-- 常用菜單設定彈窗 -->
  <div id="menu-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center hidden p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-4 py-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-gear text-orange-500"></i> 管理常用推薦菜單
        </h3>
        <button type="button" onclick="closeMenuSettingsModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs active:scale-90">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-3.5 border-b border-slate-100 bg-white">
        <div class="text-xs font-semibold text-slate-600 mb-2">新增推薦菜色：</div>
        <div class="flex gap-2 mb-2">
          <input type="text" id="new-preset-name" placeholder="餐點名稱 (例: 原味蛋餅)" class="flex-1 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-400">
          <input type="number" id="new-preset-price" placeholder="價格" class="w-20 px-3 py-2 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-orange-400">
        </div>
        <button type="button" onclick="addPresetItem()" class="w-full py-2 bg-orange-500 text-white rounded-lg text-xs font-semibold shadow-sm hover:bg-orange-600 active:scale-95 transition">
          + 加入推薦列表
        </button>
      </div>

      <div class="p-3.5 overflow-y-auto space-y-2 flex-1" id="preset-items-list"></div>

      <div class="p-3 bg-slate-50 border-t border-slate-100 flex justify-between">
        <button type="button" onclick="resetDefaultPresets()" class="text-xs text-slate-500 hover:text-orange-600">重設為系統預設</button>
        <button type="button" onclick="closeMenuSettingsModal()" class="px-4 py-1.5 bg-slate-800 text-white text-xs font-medium rounded-lg">完成</button>
      </div>
    </div>
  </div>

  <script>
    // 預設快捷清單
    var DEFAULT_PRESETS = [
      { id: '1', name: '原味蛋餅', price: 30 },
      { id: '2', name: '培根蛋吐司', price: 45 },
      { id: '3', name: '蘿蔔糕加蛋', price: 45 },
      { id: '4', name: '鮪魚蛋餅', price: 40 },
      { id: '5', name: '中杯冰奶茶', price: 25 },
      { id: '6', name: '大杯冰奶茶', price: 30 },
      { id: '7', name: '大杯熱紅茶', price: 20 },
      { id: '8', name: '無糖豆漿', price: 20 },
      { id: '9', name: '卡啦雞腿堡', price: 65 }
    ];

    var STORAGE_KEY_PRESETS = 'bf_presets_v4';
    var STORAGE_KEY_ORDERS = 'bf_orders_v4';

    var orders = [];
    var presets = [];
    var currentCart = [];
    var editingOrderId = null;

    // 初始化
    window.addEventListener('DOMContentLoaded', function() {
      try {
        var savedName = localStorage.getItem('bf_name_v4');
        if (savedName) document.getElementById('order-userName').value = savedName;

        var savedPresets = localStorage.getItem(STORAGE_KEY_PRESETS);
        presets = savedPresets ? JSON.parse(savedPresets) : DEFAULT_PRESETS.slice();

        var savedOrders = localStorage.getItem(STORAGE_KEY_ORDERS);
        orders = savedOrders ? JSON.parse(savedOrders) : [];
      } catch (err) {
        presets = DEFAULT_PRESETS.slice();
        orders = [];
      }

      renderQuickMenuChips();
      renderCurrentCart();
      updateBadge();
    });

    function saveOrders() {
      try {
        localStorage.setItem(STORAGE_KEY_ORDERS, JSON.stringify(orders));
      } catch (e) {}
      updateBadge();
    }

    function switchTab(tabId) {
      var views = ['order', 'list', 'summary'];
      for (var i = 0; i < views.length; i++) {
        var v = views[i];
        var section = document.getElementById('view-' + v);
        var btn = document.getElementById('tabBtn-' + v);
        if (v === tabId) {
          section.classList.remove('hidden');
          btn.classList.add('bg-white', 'text-orange-600', 'shadow-sm');
          btn.classList.remove('text-slate-600');
        } else {
          section.classList.add('hidden');
          btn.classList.remove('bg-white', 'text-orange-600', 'shadow-sm');
          btn.classList.add('text-slate-600');
        }
      }

      if (tabId === 'list') renderColleagueList();
      if (tabId === 'summary') renderSummaryView();
    }

    function renderQuickMenuChips() {
      var container = document.getElementById('quick-menu-chips');
      container.innerHTML = '';
      presets.forEach(function(p) {
        var chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'px-2.5 py-1.5 bg-orange-50 hover:bg-orange-100 text-orange-950 rounded-xl text-xs font-medium border border-orange-200/60 flex items-center gap-1 active:scale-95 transition';
        chip.innerHTML = '<span>' + escapeHtml(p.name) + '</span><span class="text-orange-600 font-bold">$' + p.price + '</span>';
        chip.onclick = function() { addFromPreset(p); };
        container.appendChild(chip);
      });
    }

    function addFromPreset(preset) {
      var existing = currentCart.find(function(i) {
        return i.name === preset.name && (!i.note || i.note.trim() === '');
      });
      if (existing) {
        existing.quantity += 1;
      } else {
        currentCart.push({
          id: Date.now() + Math.random().toString(36).substr(2, 4),
          name: preset.name,
          price: Number(preset.price) || 0,
          quantity: 1,
          note: ''
        });
      }
      renderCurrentCart();
    }

    function addNewCustomItem() {
      currentCart.push({
        id: Date.now() + Math.random().toString(36).substr(2, 4),
        name: '',
        price: 0,
        quantity: 1,
        note: ''
